<html>
  <head>
    <link rel="stylesheet" type="text/css" href="tab_main.css">
  </head>
  <body>
    <h2>TAB: Take a Break!</h2>
    <h3>Enable TAB monitoring:</h3>
    <p>Prepare for a whole new level of productivity!</p>
    <label class="switch">
    <input type="checkbox" id="tabButton">
    <span class="slider round" ></span>
    </label>

    <h3>Touch Grass Timer:</h3>
    <p>Set a time limit on your (relatively unimpeded) internet usage!</p>
    <label class="switch">
    <input type="checkbox" id="timerButton">
    <span class="slider round" ></span>
    </label>

    <h3>Stop the Brainrot! Mode:</h3>
    <p>Punctuate your doomscrolling with fun, mini brain games!</p>
    <label class="switch">
    <input type="checkbox" id="gameButton">
    <span class="slider round" ></span>
    </label>
    <script src="scripts/tab_main.js"></script>
  </body>
</html>
